quarkus.log.category."com.graphql".level=DEBUG
quarkus.log.category."org.springframework.web.socket".level=DEBUG
quarkus.log.category."org.springframework.messaging.simp".level=DEBUG

requests.max.requests.in.one.minute=60

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4202,http://127.0.0.1:4200,http://127.0.0.1:4202,http://192.168.0.26:4200,http://192.168.0.26:4202,http://0.0.0.0:4200,http://0.0.0.0:4202
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600

